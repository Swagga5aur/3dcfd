name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install        # switch to `npm ci` after committing package-lock.json
      - run: npm test
      - run: npm run build      # tsc + vite build -> dist/
      - name: Validate local runtime
        run: |
          cd local-runtime
          npm install
          node --check server.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Deploy only from main, never from pull requests.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
